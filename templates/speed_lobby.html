<!DOCTYPE html>
<html lang="ja">

<head><script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Speed Battle</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:
        "Segoe UI",
        "Yu Gothic",
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(0,200,255,.2),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(140,80,255,.25),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020617,
            #07182f,
            #100927
        );
}

.lobby{

    width:min(500px,92%);

    padding:35px;

    border-radius:25px;

    text-align:center;

    background:
        rgba(7,17,39,.85);

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:blur(20px);
}

.title{

    font-size:34px;

    font-weight:900;

    margin-bottom:10px;
}

.subtitle{

    color:#96accf;

    margin-bottom:25px;
}

.info-box{

    padding:18px;

    border-radius:16px;

    margin-bottom:15px;

    background:
        rgba(255,255,255,.05);
}

.info-title{

    font-size:13px;

    color:#8ccfff;
}

.info-value{

    margin-top:6px;

    font-size:22px;

    font-weight:900;
}

.join-button{

    width:100%;

    height:60px;

    border:none;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-size:18px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #168fff,
            #7558ff
        );
}

.join-button:hover{

    opacity:.9;
}

.back-button{

    display:inline-block;

    margin-top:16px;

    color:#9ab6d8;

    text-decoration:none;
}

.matching{

    display:none;

    margin-top:20px;
}

.loader{

    width:60px;

    height:60px;

    margin:0 auto 15px;

    border-radius:50%;

    border:5px solid
        rgba(255,255,255,.15);

    border-top-color:#72e7ff;

    animation:spin 1s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body>

<div class="lobby">

    <div class="title">

        ⚡ Speed Battle

    </div>

    <div class="subtitle">

        誰よりも早く反応して勝利しよう

    </div>

    <div class="info-box">

        <div class="info-title">

            参加費

        </div>

        <div class="info-value">

            💰 30 Coin

        </div>

    </div>

    <div class="info-box">

        <div class="info-title">

            勝利報酬

        </div>

        <div class="info-value">

            🏆 50 Coin

        </div>

    </div>

    <button
        class="join-button"
        onclick="joinSpeed()"
    >

        参加する

    </button>

    <div
        id="matchingArea"
        class="matching"
    >

        <div class="loader"></div>

        <h3>
            マッチング中...
        </h3>

        <p>
            対戦相手を探しています
        </p>

    </div>

    <a
        href="/matching_page"
        class="back-button"
    >

        ← ゲームセンターへ戻る

    </a>

</div>

<script>

const socket = io();

function joinSpeed(){

    document.querySelector(
        ".join-button"
    ).style.display = "none";

    document.getElementById(
        "matchingArea"
    ).style.display = "block";

    socket.emit(
        "join_speed"
    );
}

socket.on(
    "speed_waiting",

    function(data){

        document.querySelector(
            ".join-button"
        ).textContent =
            "マッチング中...";

    }
);

socket.on(
    "speed_ready",
    function(data){

        location.href =
            "/speed_online?room="
            + encodeURIComponent(
                data.room
            );

    }
);

socket.on(
    "speed_error",
    function(data){

        alert(
            data.message
        );

        location.reload();

    }
);

</script>

</body>

</html>
