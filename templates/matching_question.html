<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PAIR LINK</title>

<!-- Socket.IO -->
<script src="/socket.io/socket.io.js"></script>

<style>

/* =========================================
   基本
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    color: white;

    font-family:
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,210,255,0.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(170,65,255,0.28),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #020617,
            #07162d,
            #100822
        );
}


/* =========================================
   コンテナ
========================================= */

.container {

    width: min(
        720px,
        94%
    );

    margin:
        0 auto;

    padding:
        30px 0
        60px;
}


/* =========================================
   ヘッダー
========================================= */

.header {

    text-align: center;

    margin-bottom:
        25px;
}


.logo {

    font-size:
        12px;

    font-weight:
        900;

    letter-spacing:
        5px;

    color:
        #62ddff;
}


h1 {

    margin:
        8px 0;

    font-size:
        clamp(
            31px,
            8vw,
            49px
        );

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #66e7ff,
            #cb72ff
        );

    background-clip:
        text;

    -webkit-background-clip:
        text;

    color:
        transparent;
}


.description {

    color:
        #8799b7;

    font-size:
        13px;

    line-height:
        1.7;
}


/* =========================================
   ゲームカード
========================================= */

.game-card {

    padding:
        22px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius:
        24px;

    background:
        rgba(7,17,39,0.82);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.30);
}


.game-title {

    text-align:
        center;

    font-size:
        20px;

    font-weight:
        900;

    margin-bottom:
        7px;
}


.cost {

    text-align:
        center;

    color:
        #ffd54a;

    font-size:
        14px;

    font-weight:
        900;
}


/* =========================================
   プレイヤー表示
========================================= */

.players {

    display:
        grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:
        13px;

    margin:
        25px 0;
}


.player {

    min-height:
        110px;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius:
        18px;

    background:
        rgba(255,255,255,0.05);

    transition:
        0.25s;
}


.player.active {

    border-color:
        rgba(75,219,255,0.45);

    background:
        rgba(65,193,255,0.10);

    box-shadow:
        0 0 25px
        rgba(54,201,255,0.09);
}


.player-icon {

    width:
        54px;

    height:
        54px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    font-size:
        27px;

    background:
        linear-gradient(
            135deg,
            #173255,
            #332459
        );
}


.player.active
.player-icon {

    background:
        linear-gradient(
            135deg,
            #168fff,
            #7659ff
        );
}


.waiting {

    color:
        #6f81a0;

    font-size:
        11px;

    font-weight:
        700;
}


.player.active
.waiting {

    color:
        #80e6ff;
}


/* =========================================
   人数
========================================= */

.counter {

    text-align:
        center;

    margin-bottom:
        20px;

    color:
        #a4b8d4;

    font-weight:
        800;
}


.counter-number {

    color:
        #67e2ff;

    font-size:
        23px;

    font-weight:
        950;
}


/* =========================================
   参加ボタン
========================================= */

.join-button {

    width:
        100%;

    min-height:
        55px;

    border:
        none;

    border-radius:
        16px;

    color:
        white;

    font-size:
        15px;

    font-weight:
        950;

    cursor:
        pointer;

    background:
        linear-gradient(
            135deg,
            #168fff,
            #725cff,
            #b243ff
        );

    box-shadow:
        0 12px 35px
        rgba(104,70,255,0.30);

    transition:
        transform 0.2s,
        opacity 0.2s,
        box-shadow 0.2s;
}


.join-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 16px 40px
        rgba(104,70,255,0.40);
}


.join-button:disabled {

    cursor:
        default;

    opacity:
        0.72;

    transform:
        none;
}


/* =========================================
   マッチング状態
========================================= */

.join-message {

    min-height:
        22px;

    margin-top:
        13px;

    text-align:
        center;

    color:
        #72e5ff;

    font-size:
        12px;

    font-weight:
        800;

    line-height:
        1.5;
}


.join-message.error {

    color:
        #ff8296;
}


.join-message.success {

    color:
        #7effb0;
}


/* =========================================
   GAME FLOW
========================================= */

.flow {

    margin-top:
        20px;

    padding:
        17px;

    border-radius:
        17px;

    background:
        rgba(255,255,255,0.035);
}


.flow-title {

    margin-bottom:
        12px;

    color:
        #69ddff;

    font-size:
        12px;

    font-weight:
        900;
}


.flow-step {

    padding:
        8px 0;

    color:
        #a4b4ce;

    font-size:
        12px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.05);
}


.flow-step:last-child {

    border-bottom:
        none;
}


/* =========================================
   報酬
========================================= */

.reward {

    margin-top:
        18px;

    padding:
        15px;

    border:
        1px solid
        rgba(255,209,62,0.16);

    border-radius:
        16px;

    text-align:
        center;

    color:
        #ffdb5c;

    background:
        rgba(255,193,7,0.055);
}


/* =========================================
   HOME
========================================= */

.home-link {

    display:
        block;

    margin-top:
        20px;

    text-align:
        center;

    color:
        #72deff;

    text-decoration:
        none;

    font-size:
        12px;

    font-weight:
        800;
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 500px) {

    .container {

        padding-top:
            20px;
    }


    .game-card {

        padding:
            18px 12px;

        border-radius:
            20px;
    }


    .players {

        gap:
            8px;
    }


    .player {

        min-height:
            95px;
    }


    .player-icon {

        width:
            46px;

        height:
            46px;

        font-size:
            23px;
    }


    .join-button {

        min-height:
            53px;

        font-size:
            14px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================
         ヘッダー
    ====================================== -->

    <header class="header">

        <div class="logo">
            PAIR LINK
        </div>


        <h1>
            💕 相性診断ゲーム
        </h1>


        <div class="description">

            6人で話して、答えて、遊んで、

            <br>

            相性のいいペアを見つけよう。

        </div>

    </header>


    <!-- =====================================
         ゲーム
    ====================================== -->

    <main class="game-card">


        <div class="game-title">
            🎙 6人マッチング
        </div>


        <div class="cost">
            参加費 100 COIN
        </div>


        <!-- =================================
             6人表示
        ================================== -->

        <div
            class="players"
            id="players"
        >


            <div
                class="player"
                data-player="1"
            >

                <div class="player-icon">
                    👤
                </div>

                <div class="waiting">
                    PLAYER 1
                </div>

            </div>


            <div
                class="player"
                data-player="2"
            >

                <div class="player-icon">
                    👤
                </div>

                <div class="waiting">
                    PLAYER 2
                </div>

            </div>


            <div
                class="player"
                data-player="3"
            >

                <div class="player-icon">
                    👤
                </div>

                <div class="waiting">
                    PLAYER 3
                </div>

            </div>


            <div
                class="player"
                data-player="4"
            >

                <div class="player-icon">
                    👤
                </div>

                <div class="waiting">
                    PLAYER 4
                </div>

            </div>


            <div
                class="player"
                data-player="5"
            >

                <div class="player-icon">
                    👤
                </div>

                <div class="waiting">
                    PLAYER 5
                </div>

            </div>


            <div
                class="player"
                data-player="6"
            >

                <div class="player-icon">
                    👤
                </div>

                <div class="waiting">
                    PLAYER 6
                </div>

            </div>


        </div>


        <!-- =================================
             人数
        ================================== -->

        <div class="counter">

            現在

            <span
                class="counter-number"
                id="counterNumber"
            >
                0 / 6
            </span>

            人

        </div>


        <!-- =================================
             参加
        ================================== -->

        <button
            type="button"
            class="join-button"
            id="joinButton"
        >
            🎮 100 COINで参加
        </button>


        <div
            id="joinMessage"
            class="join-message"
        ></div>


        <!-- =================================
             FLOW
        ================================== -->

        <div class="flow">

            <div class="flow-title">
                GAME FLOW
            </div>


            <div class="flow-step">
                🎙 ① 1人60秒の自己紹介
            </div>


            <div class="flow-step">
                📝 ② ランダム5問の相性診断
            </div>


            <div class="flow-step">
                💕 ③ 相性から3ペアを決定
            </div>


            <div class="flow-step">
                ⚡ ④ 2 vs 2 vs 2 PAIR REACTION
            </div>


            <div class="flow-step">
                🏆 ⑤ 優勝ペア決定
            </div>


            <div class="flow-step">
                💬 ⑥ ペアのチャット解放
            </div>

        </div>


                <!-- =================================
             報酬
        ================================== -->

        <div class="reward">

            🏆 優勝賞金

            <br>

            1人 200 COIN

        </div>

    </main>


    <!-- =====================================
         ホームへ戻る
    ====================================== -->

    <a
        href="/home"
        class="home-button"
    >
        🏠 ホームに戻る
    </a>

</div>


<!-- =========================================
     PAIR LINK JavaScript
========================================= -->

<script>



const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinMessage =
    document.getElementById(
        "joinMessage"
    );

const counterNumber =
    document.getElementById(
        "counterNumber"
    );

const playerCards =
    document.querySelectorAll(
        ".player"
    );

let joining = false;


/* =========================================
   待機人数を画面へ反映
========================================= */

function updatePlayerCount(count) {

    let safeCount =
        Number(count) || 0;

    if (safeCount < 0) {
        safeCount = 0;
    }

    if (safeCount > 6) {
        safeCount = 6;
    }


    if (counterNumber) {

        counterNumber.textContent =
            safeCount + " / 6";
    }


    playerCards.forEach(
        function(card, index) {

            const text =
                card.querySelector(
                    ".waiting"
                );


            if (index < safeCount) {

                card.classList.add(
                    "active"
                );

                if (text) {

                    text.textContent =
                        "READY";
                }

            } else {

                card.classList.remove(
                    "active"
                );

                if (text) {

                    text.textContent =
                        "PLAYER "
                        + (index + 1);
                }
            }

        }
    );
}


/* =========================================
   メッセージ表示
========================================= */

function showMessage(
    text,
    type = ""
) {

    if (!joinMessage) {
        return;
    }


    joinMessage.textContent =
        text;


    joinMessage.classList.remove(
        "error",
        "success"
    );


    if (type) {

        joinMessage.classList.add(
            type
        );
    }
}


/* =========================================
   100 COINで参加
========================================= */

async function joinPairLink() {

    if (joining) {
        return;
    }


    if (!joinButton) {

        console.error(
            "joinButtonが見つかりません"
        );

        return;
    }


    joining = true;


    joinButton.disabled =
        true;


    joinButton.textContent =
        "マッチング参加中...";


    showMessage(
        "サーバーに接続しています..."
    );


    try {

        const response =
            await fetch(
                "/pair_link/join",
                {
                    method: "POST",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        /*
         * Python側で500エラーなどが発生して
         * HTMLが返ってきた場合
         */

        if (
            !contentType.includes(
                "application/json"
            )
        ) {

            const responseText =
                await response.text();


            console.error(
                "PAIR LINK RESPONSE:",
                responseText
            );


            throw new Error(
                "サーバー側でエラーが発生しました"
            );
        }


        const data =
            await response.json();


        /* =====================================
           エラー
        ====================================== */

        if (!response.ok) {

            showMessage(
                data.message
                ||
                data.error
                ||
                "参加できませんでした",
                "error"
            );


            joinButton.disabled =
                false;


            joinButton.textContent =
                "🎮 100 COINで参加";


            joining =
                false;


            return;
        }


        /* =====================================
           現在人数
        ====================================== */

        const maleCount =
            Number(
                data.male_count || 0
            );


        const femaleCount =
            Number(
                data.female_count || 0
            );


        let totalCount =
            Number(
                data.total_count
                ||
                (
                    maleCount
                    +
                    femaleCount
                )
            );


        /*
         * マッチ成立なら6人
         */

        if (data.matched) {

            totalCount = 6;
        }


        updatePlayerCount(
            totalCount
        );


        /* =====================================
           6人マッチング成立
        ====================================== */

        if (
            data.matched
            &&
            data.next_url
        ) {

            showMessage(
                "💕 6人揃いました！ゲームを開始します",
                "success"
            );


            joinButton.textContent =
                "ゲーム開始！";


            setTimeout(
                function() {

                    window.location.href =
                        data.next_url;

                },
                700
            );


            return;
        }


        /* =====================================
           待機中
        ====================================== */

        if (data.waiting) {

            showMessage(
                "✓ 参加しました　現在 "
                +
                totalCount
                +
                " / 6 人",
                "success"
            );


            joinButton.textContent =
                "✓ 参加済み・待機中";


            /*
             * 二重参加防止
             * ボタンはdisabledのまま
             */

            return;
        }


        /* =====================================
           その他の正常応答
        ====================================== */

        showMessage(
            "参加しました",
            "success"
        );


        joinButton.textContent =
            "✓ 参加済み";

    } catch (error) {

        console.error(
            "PAIR LINK JOIN ERROR:",
            error
        );


        showMessage(
            error.message
            ||
            "通信エラーが発生しました",
            "error"
        );


        joinButton.disabled =
            false;


        joinButton.textContent =
            "🎮 100 COINで参加";


        joining =
            false;
    }
}


/* =========================================
   ボタンと参加処理を接続
========================================= */

if (joinButton) {

    joinButton.addEventListener(
        "click",
        joinPairLink
    );

} else {

    console.error(
        "PAIR LINK: joinButtonが存在しません"
    );
}

const socket = io();

socket.on(
    "connect",
    function() {

        socket.emit(
            "pair_link_join"
        );
    }
);


socket.on(
    "pair_link_game_ready",
    function(data) {

        updatePlayerCount(6);

        showMessage(
            "💕 6人揃いました！ゲームを開始します",
            "success"
        );

        if (joinButton) {

            joinButton.textContent =
                "ゲーム開始！";
        }

        if (data.next_url) {

            setTimeout(
                function() {

                    window.location.href =
                        data.next_url;

                },
                700
            );
        }
    }
);

</script>

</body>

</html>
