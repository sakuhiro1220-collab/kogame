<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GeoGuess マッチング</title>

<style>
body { font-family: sans-serif; background:#f5f5f5; margin:0; padding:20px; }
img { width:100%; border-radius:15px; margin-bottom:20px; }
button { padding:10px 20px; font-size:18px; margin-top:20px; }
</style>
</head>
<body>

<h2>🌍 写真の場所を当ててマッチング！</h2>

<img src="/static/geoguess/{{ image }}">

<form action="/matching_geoguess_answer" method="POST">
    <input type="hidden" name="correct" value="{{ correct }}">

    <label>この写真はどこの国？</label><br><br>

    <select name="selected" style="font-size:20px; padding:10px;">
        <option value="Japan">日本</option>
        <option value="USA">アメリカ</option>
        <option value="France">フランス</option>
        <option value="Brazil">ブラジル</option>
    </select>

    <br><br>
    <button type="submit">回答する</button>
</form>

</body>
</html>
