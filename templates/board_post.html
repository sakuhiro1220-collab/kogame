<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>掲示板投稿</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    color:white;

    font-family:
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(0,197,255,.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(142,72,255,.28),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #020617,
            #07162d,
            #100822
        );

    background-attachment:fixed;
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.022) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.022) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;
}

.header{

    position:sticky;

    top:0;

    z-index:100;

    padding:
        max(13px, env(safe-area-inset-top))
        16px
        13px;

    background:
        rgba(4,13,31,.90);

    backdrop-filter:blur(20px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.header-inner{

    width:min(760px,100%);

    margin:0 auto;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.small-title{

    color:#67ddff;

    font-size:9px;

    font-weight:900;

    letter-spacing:4px;
}

.header h1{

    margin:4px 0 0;

    font-size:
        clamp(
            22px,
            5vw,
            30px
        );

    background:
        linear-gradient(
            90deg,
            #fff,
            #6de8ff,
            #b792ff
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.back-button{

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:42px;

    padding:0 15px;

    border-radius:14px;

    color:white;

    text-decoration:none;

    font-size:12px;

    font-weight:900;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:
        rgba(255,255,255,.07);
}

.container{

    width:min(760px,94%);

    margin:28px auto 70px;
}

.post-card{

    padding:25px;

    border-radius:24px;

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        rgba(7,17,39,.82);

    backdrop-filter:blur(18px);
}

.post-heading{

    margin-bottom:20px;
}

.post-heading h2{

    margin:0 0 8px;
}

.post-heading p{

    margin:0;

    color:#8ca2c4;

    line-height:1.6;
}

.form-group{

    margin-bottom:20px;
}

.form-label{

    display:block;

    margin-bottom:10px;

    font-size:13px;

    font-weight:900;
}

.category-switch{

    display:flex;

    flex-direction:column;

    gap:10px;
}

.category-option{

    display:block;

    padding:15px;

    text-align:center;

    border-radius:14px;

    cursor:pointer;

    font-weight:900;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    transition:.2s;
}

.category-option input{

    display:none;
}

.category-option:has(input:checked){

    background:
        linear-gradient(
            135deg,
            #168fff,
            #7558ff
        );

    border:none;
}

.body-input{

    width:100%;

    min-height:220px;

    resize:vertical;

    padding:15px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:
        rgba(255,255,255,.06);

    color:white;

    font-family:inherit;

    font-size:14px;

    outline:none;
}

.body-input:focus{

    border-color:
        rgba(80,218,255,.55);
}

.actions{

    display:grid;

    grid-template-columns:
        1fr 2fr;

    gap:10px;

    margin-top:25px;
}

.cancel-button{

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:52px;

    text-decoration:none;

    color:#cbd8eb;

    font-weight:900;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);
}

.submit-button{

    min-height:52px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff467b,
            #a64fff
        );
}

@media(max-width:600px){

    .actions{

        grid-template-columns:1fr;
    }

    .body-input{

        min-height:180px;
    }
}

</style>

</head>

<body>

<header class="header">

    <div class="header-inner">

        <div>

            <div class="small-title">
                NEW POST
            </div>

            <h1>
                ✏️ 掲示板投稿
            </h1>

        </div>

        <a
            href="/board"
            class="back-button"
        >
            ← 掲示板へ戻る
        </a>

    </div>

</header>

<main class="container">

    <section class="post-card">

        <div class="post-heading">

            <h2>
                📝 新しい投稿
            </h2>

            <p>
                投稿先を選択して自由に書き込んでください。
            </p>

        </div>

        <form
            action="/board_post"
            method="POST"
        >

            <div class="form-group">

                <label class="form-label">

                    投稿先

                </label>

                <div class="category-switch">

                    <label class="category-option">

                        <input
                            type="radio"
                            name="category"
                            value="normal"
                            checked
                        >

                        📢 通常掲示板

                    </label>

                    <label class="category-option">

                        <input
                            type="radio"
                            name="category"
                            value="play"
                        >

                        💬 今何してる？

                    </label>

                    <label class="category-option">

                        <input
                            type="radio"
                            name="category"
                            value="love"
                        >

                        💗 恋人募集

                    </label>

                </div>

            </div>

            <div class="form-group">

                <label
                    class="form-label"
                    for="body"
                >

                    本文

                </label>

                <textarea
                    id="body"
                    name="body"
                    class="body-input"
                    placeholder="自由に投稿してください"
                    required
                ></textarea>

            </div>

            <div class="actions">

                <a
                    href="/board"
                    class="cancel-button"
                >

                    キャンセル

                </a>

                <button
                    type="submit"
                    class="submit-button"
                >

                    🚀 投稿する

                </button>

            </div>

        </form>

    </section>

</main>

</body>

</html>
