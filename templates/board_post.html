<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>掲示板投稿</title>
</head>
<body>

<h1>掲示板に投稿する</h1>

<form action="/board_post" method="POST" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="タイトル"><br><br>
    <textarea name="body" placeholder="本文"></textarea><br><br>

    <label>画像を選択：</label>
    <input type="file" name="photo"><br><br>

    <button type="submit">投稿する</button>
</form>

<a href="/board">掲示板に戻る</a>

</body>
</html>
