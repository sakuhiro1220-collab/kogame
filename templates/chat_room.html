<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>{{ partner_user.name }}とのチャット</title>

<script src="https://cdn7.5/socket.io.min.js"></script>

<style>

/* =========================================
   基本
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    min-height: 100dvh;

    overflow: hidden;

    color: white;

    font-family:
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(0, 197, 255, 0.18),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(142, 72, 255, 0.25),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #020617,
            #07162d,
            #100822
        );
}


/* =========================================
   背景グリッド
========================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.02) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.02) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;
}


/* =========================================
   全体
========================================= */

.chat-page {

    position: relative;

    z-index: 2;

    width: 100%;
    height: 100dvh;

    display: flex;

    flex-direction: column;
}


/* =========================================
   ヘッダー
========================================= */

.chat-header {

    flex-shrink: 0;

    min-height: 70px;

    padding:
        max(10px, env(safe-area-inset-top))
        15px
        10px;

    display: grid;

    grid-template-columns:
        auto 1fr auto;

    align-items: center;

    gap: 10px;

    background:
        rgba(4, 13, 31, 0.91);

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.18);
}


.header-button {

    height: 42px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding:
        0 13px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 13px;

    color: white;

    background:
        rgba(255,255,255,0.07);

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.2s,
        background 0.2s;
}


.header-button:hover {

    transform:
        translateY(-2px);

    background:
        rgba(255,255,255,0.12);
}


.profile-button {

    color:
        #ffffff;

    background:
        linear-gradient(
            135deg,
            #ff4678,
            #8c59ff
        );

    border: none;
}


/* =========================================
   相手情報
========================================= */

.partner-box {

    min-width: 0;

    text-align: center;
}


.partner-name {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size:
        clamp(
            15px,
            4vw,
            19px
        );

    font-weight: 950;
}


.partner-status {

    margin-top: 2px;

    color:
        #6dddff;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;
}


/* =========================================
   チャット本体
========================================= */

.chat-area {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        18px
        max(
            14px,
            calc((100vw - 900px) / 2)
        )
        20px;

    scroll-behavior: smooth;

    scrollbar-width: thin;

    scrollbar-color:
        rgba(124,143,183,0.6)
        transparent;
}


/* =========================================
   吹き出し
========================================= */

.message-row {

    width: 100%;

    display: flex;

    margin-bottom: 11px;
}


.message-row.me {

    justify-content: flex-end;
}


.message-row.partner {

    justify-content: flex-start;
}


.bubble {

    position: relative;

    max-width:
        min(
            72%,
            560px
        );

    padding:
        11px 14px;

    border-radius:
        18px;

    line-height: 1.55;

    font-size: 14px;

    word-break: break-word;

    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.13);
}


.message-row.me .bubble {

    color: white;

    border-bottom-right-radius:
        5px;

    background:
        linear-gradient(
            135deg,
            #168eff,
            #7558ff
        );
}


.message-row.partner .bubble {

    color:
        #e6efff;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-bottom-left-radius:
        5px;

    background:
        rgba(255,255,255,0.085);
}


/* =========================================
   ギフト吹き出し
========================================= */

.bubble.gift {

    border:
        1px solid
        rgba(255,123,206,0.42);

    color:
        #ffe5f7;

    background:
        linear-gradient(
            135deg,
            rgba(255,63,133,0.25),
            rgba(133,76,255,0.26)
        );

    box-shadow:
        0 8px 30px
        rgba(255,77,163,0.14);
}


/* =========================================
   写真
========================================= */

.photo-img {

    display: block;

    width: auto;

    max-width: 100%;

    max-height: 330px;

    margin-top: 7px;

    border-radius: 13px;

    object-fit: cover;
}


/* =========================================
   既読
========================================= */

.read {

    display: block;

    margin-top: 5px;

    color:
        rgba(255,255,255,0.65);

    text-align: right;

    font-size: 9px;
}

/* =========================================
   入力エリア
========================================= */

/* =========================================
   入力エリア
========================================= */

.input-area {
    flex: 0 0 auto;
    flex-shrink: 0;

    position: relative;
    z-index: 100;

    width: 100%;
    max-width: 100%;

    margin: 0;

    padding:
        9px
        12px
        max(
            9px,
            env(safe-area-inset-bottom)
        );

    background:
        rgba(4,13,31,0.97);

    border-top:
        1px solid
        rgba(255,255,255,0.08);

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 -10px 35px
        rgba(0,0,0,0.22);
}


/* =========================================
   入力フォーム
========================================= */

.message-form {
    width: 100%;
    max-width: 100%;
    min-width: 0;

    margin: 0;
    padding: 0;

    display: flex;

    align-items: center;

    gap: 8px;
}


/* =========================================
   写真ボタン
========================================= */

.file-label {
    flex: 0 0 46px;

    width: 46px;
    height: 46px;

    margin: 0;
    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 14px;

    color: white;

    font-size: 20px;

    cursor: pointer;

    background:
        rgba(255,255,255,0.07);
}


.file-input {
    display: none;
}


/* =========================================
   メッセージ入力欄
========================================= */

.message-input {
    flex: 1 1 0;

    width: 0;
    min-width: 0;

    height: 46px;

    margin: 0;

    padding:
        0 15px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 15px;

    color: white;

    font-family: inherit;
    font-size: 14px;

    background:
        rgba(255,255,255,0.07);
}


.message-input:focus {
    border-color:
        rgba(82,218,255,0.50);

    background:
        rgba(255,255,255,0.10);
}


.message-input::placeholder {
    color: #7184a3;
}


/* =========================================
   送信ボタン
========================================= */

.send-button {
    flex: 0 0 72px;

    width: 72px;
    height: 46px;

    margin: 0;
    padding: 0 8px;

    border: none;

    border-radius: 14px;

    color: white;

    font-family: inherit;
    font-size: 13px;
    font-weight: 900;

    white-space: nowrap;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #168fff,
            #7659ff
        );

    box-shadow:
        0 8px 24px
        rgba(85,99,255,0.25);
}


/* =========================================
   ギフトボタン
========================================= */

.gift-open-button {
    flex: 0 0 48px;

    width: 48px;
    height: 46px;

    margin: 0;
    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border: none;

    border-radius: 14px;

    color: white;

    font-size: 21px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #ff477b,
            #b54cff
        );
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 600px) {

    .input-area {
        width: 100%;

        padding:
            7px
            6px
            max(
                7px,
                env(safe-area-inset-bottom)
            );
    }


    .message-form {
        width: 100%;

        gap: 4px;
    }


    .file-label {
        flex: 0 0 38px;

        width: 38px;
        height: 43px;

        font-size: 17px;
    }


    .message-input {
        flex: 1 1 0;

        width: 0;
        min-width: 0;

        height: 43px;

        padding:
            0 9px;

        font-size: 13px;
    }


    .send-button {
        flex: 0 0 56px;

        width: 56px;
        height: 43px;

        padding: 0 4px;

        font-size: 12px;
    }


    .gift-open-button {
        flex: 0 0 38px;

        width: 38px;
        height: 43px;

        font-size: 18px;
    }
}




/* =========================================
   動きを減らす端末設定
========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        scroll-behavior: auto !important;

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;
    }
}

</style>

</head>


<body>


<div class="chat-page">


    <!-- =====================================
         ヘッダー
    ====================================== -->

    <header class="chat-header">


        <button
            type="button"
            class="header-button"
            onclick="location.href='/chat_page'"
        >
            ← 戻る
        </button>


        <div class="partner-box">


            <div class="partner-name">

                {{ partner_user.name }}

            </div>


            <div class="partner-status">

                CHAT ROOM

            </div>


        </div>


        <a
    href="/profile/{{ partner }}"
    class="header-button profile-button"
>
            プロフィール
        </a>


    </header>


    <!-- =====================================
         メッセージ
    ====================================== -->

    <main
        class="chat-area"
        id="chatArea"
    >


        {% for msg in history %}


            {% if msg.sender == user_id %}


                <div class="message-row me">


                    <div
                        class="
                            bubble
                            {% if msg.gift %}
                                gift
                            {% endif %}
                        "
                    >

                        {{ msg.message }}


                        {% if msg.photo %}

                            {{ msg.photo }}

                        {% endif %}


                        {% if msg.read %}

                            <span class="read">
                                既読
                            </span>

                        {% endif %}


                    </div>


                </div>


            {% else %}


                <div class="message-row partner">


                    <div
                        class="
                            bubble
                            {% if msg.gift %}
                                gift
                            {% endif %}
                        "
                    >

                        {{ msg.message }}


                        {% if msg.photo %}

                            {{ msg.photo }}

                        {% endif %}


                    </div>


                </div>


            {% endif %}


        {% endfor %}


    </main>


    <!-- =====================================
     入力エリア
====================================== -->

<footer class="input-area">

    <form action="/chat_room/{{ partner }}" method="post">

        <label
            class="file-label"
            for="photoInput"
            title="写真を選択"
        >
            📷
        </label>

        <input
            type="file"
            id="photoInput"
            name="photo"
            accept="image/*"
            class="file-input"
        >

        <input
            type="text"
            id="messageInput"
            name="message"
            class="message-input"
            placeholder="メッセージ..."
            autocomplete="off"
        >

        <button
            type="submit"
            class="send-button"
        >
            送信
        </button>

        <button
            type="button"
            class="gift-open-button"
            onclick="openGiftMenu()"
            aria-label="ギフト"
            title="ギフト"
        >
            🎁
        </button>

    </form>

</footer>


            <button
                type="button"
                class="gift-close"
                onclick="closeGiftMenu()"
            >
                ×
            </button>


        </div>


        <div class="gift-grid">


            <button

                class="gift-card gift-bronze"
                onclick="sendRankGift('銅')"

                </span>

                <span class="gift-star">

                </span>

            </button>


            <button

                class="gift-card gift-silver"
                onclick="sendRankGift('銀')"
            >

                    🥈

                <span class="gift-name">
                    銀

                <span class="gift-price">
                    💰 30 Coin
                </span>

                <span class="gift-star">
                    ⭐ +15
                </span>

            </button>


            <button
                type="button"
                class="gift-card gift-gold"
                onclick="sendRankGift('金')"
            >

                <span class="gift-emoji">
                    🥇
                </span>

                <span class="gift-name">
                    金

                </span>

            </button>


            <button

            >

                </span>

                <span class="gift-name">
                    サファイア
                </span>

                <span class="gift-price">
                    💰 120 Coin
                </span>

                <span class="gift-star">

            </button>


            <button

            >

                    エメラルド

            <button

            >

                    ハートの雨

                </span>

                </span>

            </button>


            <button
                type="button"
                class="gift-card gift-gem"
                onclick="sendRankGift('宝石の爆発')"
            >

                <span class="gift-emoji">
                    💎
                </span>

                <span class="gift-name">
                    宝石の爆発
                </span>

                <span class="gift-price">

                </span>

                <span class="gift-star">

                </span>

            </button>


            <button
                type="button"
                class="gift-card gift-dragon"
                onclick="sendRankGift('恋の龍')"
            >

                <span class="gift-emoji">
                    🐉
                </span>

                <span class="gift-name">
                    恋の龍
                </span>

                </span>

            </button>


        </div>


    </div>

</div>


<div id="giftEffectLayer"></div>


<script>

/* =========================================
   基本
========================================= */

const partnerId =
    "{{ partner }}";

const currentUserId =
    "{{ user_id }}";

const socket =
    io();


function openPartnerProfile() {

    location.href =
        "/profile/"
        + encodeURIComponent(
            partnerId
        );
}


/* =========================================
   Socket.IOルーム
========================================= */

socket.emit(
    "join_room",
    {
        room:
            currentUserId,

        user_id:
            currentUserId
    }
);


/* =========================================
   チャットを下までスクロール
========================================= */

function scrollChatBottom() {

    const area =
        document.getElementById(
            "chatArea"
        );


    if (area) {

        area.scrollTop =
            area.scrollHeight;
    }
}


window.addEventListener(
    "load",
    scrollChatBottom
);


/* =========================================
   ギフトメニュー
========================================= */

function openGiftMenu() {

    document.getElementById(
        "giftModal"
    ).classList.add(
        "show"
    );
}


function closeGiftMenu() {

    document.getElementById(
        "giftModal"
    ).classList.remove(
        "show"
    );
}


document.getElementById(
    "giftModal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            closeGiftMenu();
        }
    }
);


/* =========================================
   ギフト送信
========================================= */

let giftSending =
    false;


function sendRankGift(rank) {

    if (giftSending) {

        return;
    }


    giftSending =
        true;

    console.log(
"ギフト送信:",
rank,
partnerId
);  


    socket.emit(
        "send_rank_gift",
        {
            partner:
                partnerId,

            rank:
                rank
        }
    );


    closeGiftMenu();

    
    /*
       現在は送信直後に
       送信者側の演出を再生
    */

    playGiftAnimation(
        rank
    );


    setTimeout(
        () => {

            giftSending =
                false;

        },
        1300
    );
}

/* =========================================
   ギフト送信成功
========================================= */

socket.on(
    "gift_sent",
   function(data) {

        giftSending = false;


        addGiftMessage(
            "🎁 "
            + data.rank
            + "ギフトを送りました！（+"
            + data.stars
            + "）",
            true
        );


        playGiftAnimation(
            data.rank
        );
    }
);


/* =========================================
   ギフト受信
========================================= */

socket.on(
    "gift_received",
    function(data) {

        addGiftMessage(
            "🎁 "
            + data.rank
            + "ギフトを受け取りました！（+"
            + data.stars
            + "）",
            false
        );


        playGiftAnimation(
            data.rank
        );
    }
);


/* =========================================
   ギフトエラー
========================================= */

socket.on(
    "gift_error",
    function(data) {

        giftSending =
            false;


        alert(
            data.message
            || "ギフトを送信できませんでした"
        );
    }
);


/* =========================================
   ギフトメッセージ追加
========================================= */

function addGiftMessage(
    text,
    me = true
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );


    if (!chatArea) {
        return;
    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row "
        + (
            me
            ? "me"
            : "partner"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble gift";


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    chatArea.appendChild(
        row
    );


    scrollChatBottom();
}


/* =========================================
   演出レイヤー開始
========================================= */

function startEffectLayer() {

    const layer =
        document.getElementById(
            "giftEffectLayer"
        );


    layer.innerHTML =
        "";


    layer.classList.add(
        "active"
    );


    return layer;
}


/* =========================================
   演出レイヤー終了
========================================= */

function endEffectLayer(
    delay = 2500
) {

    setTimeout(
        () => {

            const layer =
                document.getElementById(
                    "giftEffectLayer"
                );


            layer.classList.remove(
                "active"
            );


            layer.innerHTML =
                "";

        },

/* =========================================
   粒子生成
========================================= */

function createParticles(
    layer,
    symbols,
    count
) {

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.textContent =
            symbols[
                Math.floor(
                    Math.random()
                    * symbols.length
                )
            ];


        particle.style.position =
            "absolute";


        particle.style.left =
            "50%";


        particle.style.top =
            "50%";


        particle.style.zIndex =
            "10";


        particle.style.fontSize =
            (
                15
                + Math.random()
                * 24
            )
            + "px";


        layer.appendChild(
            particle
        );


        const x =
            (
                Math.random()
                - 0.5
            )
            * window.innerWidth
            * 0.9;


        const y =
            (
                Math.random()
                - 0.5
            )
            * window.innerHeight
            * 0.8;


        const rotation =
            Math.random()
            * 720;


        particle.animate(
            [
                {
                    opacity: 0,

                    transform:
                        "translate(-50%, -50%) scale(0.2)"
                },

                {
                    opacity: 1,

                    transform:
                        "translate(-50%, -50%) scale(1.2)"
                },

                {
                    opacity: 0,

                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        )
                        rotate(${rotation}deg)
                        scale(0.5)`
                }
            ],
            {
                duration:
                    1300
                    + Math.random()
                    * 1000,

                easing:
                    "ease-out",

                fill:
                    "forwards"
            }
        );
    }
}
