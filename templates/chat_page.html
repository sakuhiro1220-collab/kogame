<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>チャット一覧</title>
<style>

.home-button {
    position: fixed;
    top: 20px;
    left: 200px;

    padding: 10px 18px;

    border: none;
    border-radius: 12px;

    background: #ffffff;
    color: #333;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 3px 10px rgba(0,0,0,0.15);

    z-index: 1000;

    transition: 0.2s;
}

.home-button:hover {
    transform: translateY(-2px);
    background: #f2f2f2;
}


body { font-family: sans-serif; background: #f5f5f5; margin: 0; }
.chat-item {
    background: white;
    padding: 15px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
}
.chat-item img {
    width: 50px; height: 50px;
    border-radius: 50%;
    margin-right: 15px;
}
.name { font-weight: bold; }
.message { color: #666; }
</style>
</head>
<body>

<h2 style="padding:15px;">チャット一覧</h2>

{% for partner, last in partners.items() %}
<a href="/chat_room/{{ partner }}" style="text-decoration:none; color:black;">
<div class="chat-item">
    <img src="{{ users[partner].photo_url or '/static/default.png' }}">
    <div>
        <div class="name">{{ users[partner].name }}</div>
        <div class="message">{{ last.message }}</div>
    </div>
</div>
</a>
{% endfor %}

<button class="home-button" onclick="location.href='/home'">
    🏠 ホームに戻る
</button>

</body>
</html>
