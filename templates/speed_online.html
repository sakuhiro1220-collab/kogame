<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Speed Battle</title>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                "Hiragino Sans",
                "Yu Gothic",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 195, 255, 0.28),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(139, 92, 246, 0.30),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #030712,
                    #07152d,
                    #100925
                );

            overflow: hidden;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;
        }

        .game-wrap {
            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            z-index: 2;
        }

        .game-card {
            width: 100%;
            max-width: 760px;

            padding: 42px;

            border-radius: 32px;

            background:
                rgba(8, 15, 35, 0.78);

            border:
                1px solid
                rgba(130, 190, 255, 0.21);

            backdrop-filter: blur(22px);

            box-shadow:
                0 30px 90px rgba(0,0,0,0.55),
                0 0 60px rgba(66,153,225,0.08);

            text-align: center;
        }

        .logo {
            font-size: 13px;
            letter-spacing: 7px;

            color: #67d9ff;

            margin-bottom: 10px;

            font-weight: 900;
        }

        h1 {
            font-size: clamp(
                34px,
                7vw,
                68px
            );

            line-height: 1;

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #73e6ff,
                    #a88cff
                );

           background-clip: text;
-webkit-background-clip: text;
color: transparent;
        }

        .subtitle {
            margin-top: 12px;

            color: #8293b2;

            font-size: 14px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;

            gap: 15px;

            margin-top: 30px;
        }

        .info-box {
            flex: 1;

            padding: 14px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.08);
        }

        .info-label {
            color: #71809a;

            font-size: 11px;

            margin-bottom: 5px;
        }

        .info-value {
            font-weight: 800;

            font-size: 16px;
        }

        .arena {
            margin-top: 35px;

            padding: 42px 20px;

            border-radius: 25px;

            background:
                rgba(0,0,0,0.24);

            border:
                1px solid
                rgba(255,255,255,0.07);
        }

        #status {
            min-height: 45px;

            font-size: 22px;
            font-weight: 800;

            color: #dce8ff;
        }

        #subStatus {
            margin-top: 8px;

            min-height: 25px;

            color: #71819d;

            font-size: 13px;
        }

        .loader {
            width: 65px;
            height: 65px;

            margin:
                35px auto 20px;

            border-radius: 50%;

            border:
                4px solid
                rgba(255,255,255,0.08);

            border-top-color:
                #5cdcff;

            border-right-color:
                #9c7dff;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        #reactionButton {
            width: 210px;
            height: 210px;

            margin-top: 30px;

            border-radius: 50%;

            border: none;

            font-size: 37px;

            font-weight: 900;

            color: white;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #45e4ff 12%,
                    #167bea 50%,
                    #703cff
                );

            box-shadow:
                0 0 35px
                    rgba(56,189,248,0.45),
                0 0 90px
                    rgba(124,58,237,0.28);

            transition:
                transform 0.12s,
                filter 0.12s;

            display: none;
        }

        #reactionButton:hover {
            transform:
                scale(1.04);
        }

        #reactionButton:active {
            transform:
                scale(0.91);
        }

        .go {
            color: #5effc8 !important;

            font-size: 58px !important;

            text-shadow:
                0 0 30px
                rgba(94,255,200,0.7);
        }

        /* =====================
           中央通知
        ===================== */

        .modal {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(0,0,0,0.68);

            backdrop-filter:
                blur(10px);

            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 440px;

            padding: 38px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #111b33,
                    #080d1c
                );

            border:
                1px solid
                rgba(255,255,255,0.14);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,0.70);

            text-align: center;

            animation:
                modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;

                transform:
                    scale(0.86)
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        #modalIcon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        #modalTitle {
            font-size: 29px;

            margin-bottom: 12px;
        }

        #modalMessage {
            color: #9aaaca;

            line-height: 1.7;
        }

        .modal-button {
            display: block;

            width: 100%;

            margin-top: 25px;
            padding: 14px;

            border-radius: 13px;

            border: none;

            cursor: pointer;

            font-size: 15px;
            font-weight: 800;

            text-decoration: none;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #288fff,
                    #805bff
                );
        }

        .result-time {
            margin-top: 15px;

            padding: 16px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.05);

            color: #dce8ff;
        }

        @media (
            max-width: 600px
        ) {

            .game-card {
                padding:
                    30px 18px;

                border-radius:
                    23px;
            }

            .info-bar {
                flex-direction:
                    column;
            }

            #reactionButton {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>

<div class="game-wrap">

    <main class="game-card">

        <div class="logo">
            REALTIME BATTLE
        </div>

        <h1>SPEED</h1>

        <p class="subtitle">
            最速の反応を叩き出せ
        </p>

        <div class="info-bar">

            <div class="info-box">

                <div class="info-label">
                    PLAYER
                </div>

                <div
                    class="info-value"
                    id="playerId"
                >
                    {{ user_id }}
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    COINS
                </div>

                <div
                    class="info-value"
                    id="coinValue"
                >
                    {{ coins }}
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    TABLE
                </div>

                <div
                    class="info-value"
                    id="roomValue"
                >
                    未決定
                </div>

            </div>

        </div>


        <section class="arena">

            <div id="status">
                マッチングを開始しています
            </div>

            <div id="subStatus">
                対戦相手を検索中...
            </div>

            <div
                class="loader"
                id="loader"
            ></div>

            <button
                id="reactionButton"
                disabled
            >
                PUSH!
            </button>

        </section>

    </main>

</div>


<!-- 中央モーダル -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-card">

        <div id="modalIcon">
            ⚡
        </div>

        <h2 id="modalTitle">
            SPEED
        </h2>

        <div id="modalMessage"></div>

        <a
            href="/"
            class="btn"
        >
            ホームへ戻る
        </a>

    </div>

</div>


<script>

const socket = io();

const userId = "{{ user_id }}";

let currentRoom = null;

let startTime = null;

let alreadyPressed = false;


const statusEl =
    document.getElementById(
        "status"
    );

const subStatusEl =
    document.getElementById(
        "subStatus"
    );

const button =
    document.getElementById(
        "reactionButton"
    );

const loader =
    document.getElementById(
        "loader"
    );

const roomValue =
    document.getElementById(
        "roomValue"
    );

const coinValue =
    document.getElementById(
        "coinValue"
    );


function showModal(
    icon,
    title,
    message
) {

    document.getElementById(
        "modalIcon"
    ).textContent = icon;

    document.getElementById(
        "modalTitle"
    ).textContent = title;

    document.getElementById(
        "modalMessage"
    ).innerHTML = message;

    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );
}


/* =====================
   接続後マッチング開始
===================== */

socket.on(
    "connect",

    () => {

        statusEl.textContent =
            "マッチング中";

        subStatusEl.textContent =
            "参加可能な卓を探しています...";

        socket.emit(
            "join_speed",
            {}
        );
    }
);

/* =====================
   1人目：待機
===================== */

socket.on(
    "speed_waiting",

    data => {

        currentRoom =
            data.room;

        roomValue.textContent =
            currentRoom;

        if (
            data.coins !== undefined
        ) {

            coinValue.textContent =
                data.coins;
        }

        statusEl.textContent =
            "対戦相手を待っています";

        subStatusEl.textContent =
            "相手が参加すると自動的に開始します";

        loader.style.display =
            "block";
    }
);


/* =====================
   既存の部屋へ復帰
===================== */

socket.on(
    "speed_joined",

    data => {

        currentRoom =
            data.room;

        roomValue.textContent =
            currentRoom;

        if (
            data.status === "waiting"
        ) {

            statusEl.textContent =
                "対戦相手を待っています";

            subStatusEl.textContent =
                "相手が参加すると自動的に開始します";

            loader.style.display =
                "block";

        } else {

            statusEl.textContent =
                "対戦へ復帰しました";

            subStatusEl.textContent =
                "ゲーム状態を確認しています";

            loader.style.display =
                "block";
        }
    }
);


/* =====================
   2人揃った
===================== */

socket.on(
    "speed_ready",

    data => {

        currentRoom =
            data.room;

        roomValue.textContent =
            currentRoom;

        loader.style.display =
            "none";

        statusEl.textContent =
            "READY...";

        subStatusEl.textContent =
            "合図が出るまで押さないでください";

        button.style.display =
            "inline-block";

        button.disabled =
            true;

        button.textContent =
            "WAIT";

        alreadyPressed =
            false;

        startTime =
            null;

        setTimeout(
            () => {

                statusEl.textContent =
                    "GO!";

                statusEl.classList.add(
                    "go"
                );

                subStatusEl.textContent =
                    "今すぐ押せ！";

                button.disabled =
                    false;

                button.textContent =
                    "PUSH!";

                startTime =
                    performance.now();

            },

            Number(data.delay) * 1000
        );
    }
);


/* =====================
   PUSHボタン
===================== */

button.addEventListener(
    "click",

    () => {

        if (
            button.disabled
            ||
            alreadyPressed
            ||
            startTime === null
            ||
            !currentRoom
        ) {

            return;
        }

        alreadyPressed =
            true;

        button.disabled =
            true;

        button.textContent =
            "DONE";

        const reaction =
            (
                performance.now()
                - startTime
            ) / 1000;

        statusEl.textContent =
            "回答完了";

        statusEl.classList.remove(
            "go"
        );

        subStatusEl.textContent =
            "相手の結果を待っています...";

        socket.emit(
            "speed_reaction",

            {
                room:
                    currentRoom,

                reaction:
                    reaction
            }
        );
    }
);


/* =====================
   相手の入力待ち
===================== */

socket.on(
    "speed_opponent_wait",

    data => {

        statusEl.textContent =
            "相手を待っています";

        subStatusEl.textContent =
            data.message
            || "相手の入力を待っています";
    }
);


/* =====================
   対戦結果
===================== */

socket.on(
    "speed_result",

    data => {

        button.disabled =
            true;

        statusEl.classList.remove(
            "go"
        );

        const isWinner =
            data.winner === userId;

        let myTime;
        let opponentTime;
        let reward;

        if (isWinner) {

            myTime =
                data.winner_reaction;

            opponentTime =
                data.loser_reaction;

            reward =
                data.winner_reward;

        } else {

            myTime =
                data.loser_reaction;

            opponentTime =
                data.winner_reaction;

            reward =
                data.loser_reward;
        }

        showModal(
            isWinner
                ? "🏆"
                : "⚡",

            isWinner
                ? "あなたの勝ち！"
                : "あなたの負け",

            `
                <div class="result-time">

                    あなたの反応時間

                    <br>

                    <strong>
                        ${Number(
                            myTime
                        ).toFixed(3)}
                        秒
                    </strong>

                    <br><br>

                    相手の反応時間

                    <br>

                    <strong>
                        ${Number(
                            opponentTime
                        ).toFixed(3)}
                        秒
                    </strong>

                </div>

                <br>

                獲得コイン

                <br>

                <strong>
                    +${reward} COIN
                </strong>
            `
        );
    }
);


/* =====================
   エラー
===================== */

socket.on(
    "speed_error",

    data => {

        loader.style.display =
            "none";

        statusEl.textContent =
            "エラーが発生しました";

        subStatusEl.textContent =
            "";

        showModal(
            "⚠️",

            "ゲームを開始できません",

            data.message
            || "エラーが発生しました"
        );
    }
);

</script>

</body>

</html>
