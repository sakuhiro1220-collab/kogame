<!DOCTYPE html>

<style>

/* =========================================
   基本
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    color: white;

    font-family:
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(0, 200, 255, 0.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 88% 80%,
            rgba(142, 72, 255, 0.30),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #020617,
            #07162d,
            #100822
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =========================================
   背景グリッド
========================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.55;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;

    z-index: 0;
}


/* =========================================
   ヘッダー
========================================= */

.header {

    position: relative;

    z-index: 10;

    padding:
        max(22px, env(safe-area-inset-top))
        18px
        18px;

    text-align: center;
}


.header h1 {

    margin: 0;

    font-size:
        clamp(
            27px,
            6vw,
            42px
        );

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffd95a,
            #ffb300
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}


.header p {

    margin:
        8px 0 0;

    color:
        #8ea2c3;

    font-size:
        13px;
}


/* =========================================
   メイン
========================================= */

.container {

    position: relative;

    z-index: 2;

    width:
        min(
            1000px,
            94%
        );

    margin:
        10px auto
        60px;
}


/* =========================================
   コイングリッド
========================================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 18px;
}


/* =========================================
   購入カード
========================================= */

.coin-box {

    position: relative;

    min-height: 390px;

    overflow: hidden;

    padding:
        20px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius:
        24px;

    text-align:
        center;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            rgba(10,26,51,0.94),
            rgba(18,14,49,0.92)
        );

    box-shadow:
        0 16px 45px
        rgba(0,0,0,0.27);

    transition:
        transform 0.25s,
        border-color 0.25s,
        box-shadow 0.25s;
}


.coin-box:hover {

    transform:
        translateY(-7px);

    border-color:
        rgba(255,213,76,0.38);

    box-shadow:
        0 22px 55px
        rgba(0,0,0,0.38),
        0 0 35px
        rgba(255,191,27,0.10);
}


/* =========================================
   カードの金色オーラ
========================================= */

.coin-box::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 110px;

    width: 290px;

    height: 180px;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    pointer-events:
        none;

    background:
        radial-gradient(
            circle,
            rgba(255,199,30,0.18),
            transparent 70%
        );

    filter:
        blur(15px);
}


/* =========================================
   コイン山エリア
========================================= */

.coin-pile {

    position: relative;

    height: 190px;

    margin-bottom: 4px;
}


/* =========================================
   コイン本体
========================================= */

.gold-coin {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    height: 53px;

    font-size: 43px;

    filter:

            rgba(0,0,0,0.45)

            0 0 8px
            rgba(255,197,35,0.35)
        );

    user-select: none;
}


/* =========================================

========================================= */

<script>

/* =========================================
   Stripe決済
========================================= */

function payStripe(coin) {

    fetch(
        "/pay/stripe",
        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify({
                    amount: coin
                })
        }
    )

    .then(
        response =>
            response.json()
    )

    .then(
        data => {

            if (data.url) {

                window.location.href =
                    data.url;

            } else {

                alert(
                    "Stripeエラー: "
                    + (
                        data.error
                        || "不明なエラー"
                    )
                );
            }
        }
    )

    .catch(
        error => {

            console.error(
                error
            );

            alert(
                "決済ページを開けませんでした"
            );
        }
    );
}

</script>
