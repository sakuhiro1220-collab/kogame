<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>コイン購入</title>

<style>

/* =========================================
   基本
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    color: white;

    font-family:
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background:
        radial-gradient(
            circle at 12% 6%,
            rgba(0, 200, 255, 0.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 88% 82%,
            rgba(143, 72, 255, 0.30),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #020617,
            #07162d,
            #100822
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =========================================
   背景グリッド
========================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.022) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.022) 1px,
            transparent 1px
        );

    background-size: 45px 45px;
}


/* =========================================
   ヘッダー
========================================= */

.header {

    position: relative;

    z-index: 5;

    padding:
        max(28px, env(safe-area-inset-top))
        15px
        22px;

    text-align: center;
}


.shop-label {

    margin-bottom: 5px;

    color: #68dcff;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 4px;
}


.header h1 {

    margin: 0;

    font-size:
        clamp(
            29px,
            7vw,
            43px
        );

    background:
        linear-gradient(
            90deg,
            #fff,
            #fff1a0,
            #ffc435
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    text-shadow:
        0 0 35px
        rgba(255,190,40,0.10);
}


.header p {

    margin:
        9px 0 0;

    color: #8fa3c2;

    font-size: 12px;
}


/* =========================================
   メイン
========================================= */

.container {

    position: relative;

    z-index: 2;

    width: min(1000px, 94%);

    margin:
        0 auto
        60px;
}


/* =========================================
   グリッド
========================================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 18px;
}


/* =========================================
   商品カード
========================================= */

.coin-box {

    position: relative;

    overflow: hidden;

    min-height: 400px;

    padding:
        20px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 24px;

    text-align: center;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            rgba(8,23,47,0.95),
            rgba(20,14,48,0.94)
        );

    backdrop-filter: blur(18px);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.28);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}


.coin-box:hover {

    transform: translateY(-6px);

    border-color:
        rgba(255,210,64,0.38);

    box-shadow:
        0 23px 60px
        rgba(0,0,0,0.40),
        0 0 35px
        rgba(255,190,29,0.10);
}


/* =========================================
   商品背景の金色オーラ
========================================= */

.coin-box::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 90px;

    width: 300px;
    height: 210px;

    transform: translateX(-50%);

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255,199,41,0.22),
            rgba(255,162,0,0.06) 48%,
            transparent 70%
        );

    filter: blur(16px);
}


/* =========================================
   金貨画像
========================================= */

.coin-image-area {

    position: relative;

    z-index: 2;

    height: 210px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    margin-bottom: 4px;
}


.coin-image {

    display: block;

    max-width: 90%;

    max-height: 195px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 15px 15px
            rgba(0,0,0,0.45)
        );

    transition:
        transform 0.3s ease,
        filter 0.3s ease;
}


.coin-box:hover .coin-image {

    transform:
        translateY(-5px)
        scale(1.035);

    filter:
        drop-shadow(
            0 20px 18px
            rgba(0,0,0,0.50)
        )
        drop-shadow(
            0 0 16px
            rgba(255,199,48,0.16)
        );
}


/* =========================================
   プランごとの画像サイズ
========================================= */

.plan-100 .coin-image {
    max-width: 58%;
    max-height: 135px;
}


.plan-500 .coin-image {
    max-width: 72%;
    max-height: 160px;
}


.plan-1000 .coin-image {
    max-width: 83%;
    max-height: 180px;
}


.plan-10000 .coin-image {
    max-width: 100%;
    max-height: 205px;
}


/* =========================================
   コイン数
========================================= */

.coin {

    position: relative;

    z-index: 3;

    margin-top: 5px;

    color: #fff5bd;

    font-size:
        clamp(
            23px,
            5vw,
            30px
        );

    font-weight: 950;

    letter-spacing: 0.5px;
}


.coin span {

    margin-left: 4px;

    color: #ffc83d;

    font-size: 12px;

    font-weight: 900;
}


/* =========================================
   価格
========================================= */

.price {

    position: relative;

    z-index: 3;

    margin-top: 7px;

    color: #becde3;

    font-size: 17px;

    font-weight: 800;
}


/* =========================================
   購入ボタン
========================================= */

.buy-button {

    position: relative;

    z-index: 3;

    width: 100%;

    min-height: 48px;

    margin-top: 17px;

    border: none;

    border-radius: 14px;

    color: #271700;

    font-size: 13px;

    font-weight: 950;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #fff18a,
            #ffc52f,
            #ff9f05
        );

    box-shadow:
        0 9px 25px
        rgba(255,175,22,0.20);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}


.buy-button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(255,175,22,0.32);
}


/* =========================================
   人気バッジ
========================================= */

.badge {

    position: absolute;

    top: 13px;
    right: 13px;

    z-index: 10;

    padding:
        6px 11px;

    border-radius: 999px;

    color: #081528;

    font-size: 10px;

    font-weight: 950;

    background:
        linear-gradient(
            135deg,
            #72e8ff,
            #91baff
        );

    box-shadow:
        0 5px 15px
        rgba(91,211,255,0.20);
}


/* =========================================
   最高額
========================================= */

.premium {

    border:
        1px solid
        rgba(255,201,34,0.39);

    background:
        linear-gradient(
            145deg,
            rgba(25,27,46,0.98),
            rgba(49,20,58,0.96)
        );

    box-shadow:
        0 18px 55px
        rgba(0,0,0,0.34),
        0 0 40px
        rgba(255,187,23,0.09);
}


.premium::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            transparent 20%,
            rgba(255,226,130,0.055) 45%,
            transparent 70%
        );
}


.premium-badge {

    color: #392100;

    background:
        linear-gradient(
            135deg,
            #fff59b,
            #ffc52e,
            #ff9d00
        );

    box-shadow:
        0 5px 18px
        rgba(255,181,15,0.30);
}


/* =========================================
   安心表示
========================================= */

.secure {

    margin:
        25px auto 0;

    padding:
        13px;

    max-width: 600px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 14px;

    text-align: center;

    color: #7488a7;

    font-size: 10px;

    line-height: 1.6;

    background:
        rgba(255,255,255,0.035);
}


/* =========================================
   ホーム
========================================= */

.back-area {

    margin-top: 22px;

    text-align: center;
}


.back {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 45px;

    padding:
        0 19px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 14px;

    color: white;

    text-decoration: none;

    font-size: 12px;

    font-weight: 900;

    background:
        rgba(255,255,255,0.06);

    transition:
        transform 0.2s,
        background 0.2s;
}


.back:hover {

    transform: translateY(-2px);

    background:
        rgba(255,255,255,0.11);
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 650px) {

    .header {

        padding-bottom: 16px;
    }


    .header p {

        font-size: 10px;
    }


    .container {

        width: 95%;
    }


    .grid {

        gap: 9px;
    }


    .coin-box {

        min-height: 315px;

        padding:
            11px 9px
            13px;

        border-radius: 18px;
    }


    .coin-image-area {

        height: 150px;

        margin-top: 9px;
    }


    .plan-100 .coin-image {

        max-width: 62%;

        max-height: 95px;
    }


    .plan-500 .coin-image {

        max-width: 78%;

        max-height: 118px;
    }


    .plan-1000 .coin-image {

        max-width: 90%;

        max-height: 135px;
    }


    .plan-10000 .coin-image {

        max-width: 100%;

        max-height: 148px;
    }


    .coin {

        font-size: 19px;
    }


    .coin span {

        font-size: 9px;
    }


    .price {

        font-size: 14px;
    }


    .buy-button {

        min-height: 42px;

        margin-top: 12px;

        font-size: 11px;
    }


    .badge {

        top: 8px;
        right: 8px;

        padding:
            5px 7px;

        font-size: 8px;
    }
}


/* =========================================
   小型スマホ
========================================= */

@media (max-width: 390px) {

    .grid {

        grid-template-columns: 1fr;
    }


    .coin-box {

        min-height: 340px;
    }


    .coin-image-area {

        height: 175px;
    }


    .plan-100 .coin-image {

        max-width: 50%;

        max-height: 115px;
    }


    .plan-500 .coin-image {

        max-width: 65%;

        max-height: 135px;
    }


    .plan-1000 .coin-image {

        max-width: 78%;

        max-height: 155px;
    }


    .plan-10000 .coin-image {

        max-width: 95%;

        max-height: 170px;
    }
}

</style>

</head>


<body>


<header class="header">

    <div class="shop-label">
        COIN SHOP
    </div>

    <h1>
        コインショップ
    </h1>

    <p>
        コインを購入してチャットやギフトをもっと楽しもう
    </p>

</header>


<main class="container">


    <div class="grid">


        <!-- =================================
             100 COIN
        ================================== -->

        <div
            class="coin-box plan-100"
            onclick="payStripe(100)"
        >

            <div class="coin-image-area">

                <img src="/static/coins/coin_100.png" alt="100 COIN" class="coin-image">

            </div>


            <div class="coin">

                100

                <span>
                    COIN
                </span>

            </div>


            <div class="price">
                980円
            </div>


            <button
                type="button"
                class="buy-button"
            >
                購入する
            </button>

        </div>


        <!-- =================================
             500 COIN
        ================================== -->

        <div
            class="coin-box plan-500"
            onclick="payStripe(500)"
        >

            <div class="coin-image-area">

                <img src="/static/coins/coin_500.png" alt="500 COIN" class="coin-image">

            </div>


            <div class="coin">

                500

                <span>
                    COIN
                </span>

            </div>


            <div class="price">
                3,980円
            </div>


            <button
                type="button"
                class="buy-button"
            >
                購入する
            </button>

        </div>


        <!-- =================================
             1,000 COIN
        ================================== -->

        <div
            class="coin-box plan-1000"
            onclick="payStripe(1000)"
        >

            <div class="badge">
                人気
            </div>


            <div class="coin-image-area">

                <img src="/static/coins/coin_1000.png" alt="1,000 COIN" class="coin-image">

            </div>


            <div class="coin">

                1,000

                <span>
                    COIN
                </span>

            </div>


            <div class="price">
                6,980円
            </div>


            <button
                type="button"
                class="buy-button"
            >
                購入する
            </button>

        </div>


        <!-- =================================
             10,000 COIN
        ================================== -->

        <div
            class="coin-box plan-10000 premium"
            onclick="payStripe(10000)"
        >

            <div class="badge premium-badge">
                👑 MAX
            </div>


            <div class="coin-image-area">

                <img src="/static/coins/coin_10000.png" alt="10,000 COIN" class="coin-image">

            </div>


            <div class="coin">

                10,000

                <span>
                    COIN
                </span>

            </div>


            <div class="price">
                59,800円
            </div>


            <button
                type="button"
                class="buy-button"
            >
                👑 大量コインを購入
            </button>

        </div>


    </div>


    <div class="secure">

        🔒 決済ボタンを押すとStripeの決済ページへ移動します。

    </div>


    <div class="back-area">

        <a href="/home">
            🏠 ホームに戻る
        </a>

    </div>


</main>


<script>

/* =========================================
   Stripe決済
========================================= */

function payStripe(coin) {

    fetch(
        "/pay/stripe",
        {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                amount: coin
            })

        }
    )

    .then(response => {

        return response.json();

    })

    .then(data => {

        if (data.url) {

            window.location.href =
                data.url;

        } else {

            alert(
                "Stripeエラー: "
                + (
                    data.error
                    || "不明なエラー"
                )
            );
        }

    })

    .catch(error => {

        console.error(
            "Stripe error:",
            error
        );

        alert(
            "決済ページを開けませんでした"
        );

    });
}

</script>


</body>

</html>
